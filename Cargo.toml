[package]
name = "jujutsu-mcp"
version = "0.1.1"
edition = "2024"
description = "MCP server that lets Claude Code, Codex and Antigravity use jj (Jujutsu) without a shell"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LLawli/jujutsu-mcp"
homepage = "https://github.com/LLawli/jujutsu-mcp"
readme = "README.md"
keywords = ["jj", "jujutsu", "mcp", "vcs", "agents"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "packaging/", "bin/", "justfile"]

[dependencies]
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "sync", "time"] }
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "server", "transport-io", "macros"] }
tempfile = "3.27.0"
