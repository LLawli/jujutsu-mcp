name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The release the integration tests run against (TESTED_JJ_VERSION in src/jj.rs).
  JJ_VERSION: "0.45.1"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install jj
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.local/bin" ./jj
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check jj
        run: jj --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Integration tests drive the real jj, git and ssh-keygen; they fail,
      # never skip, when one is missing.
      - name: Test
        run: cargo test --locked

  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The test suite uses Unix-only fixtures (/proc, shell scripts), so
        # these platforms build and lint the library and binary only.
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Build
        run: cargo build --locked --release
