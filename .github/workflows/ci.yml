name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The release the integration tests run against (TESTED_JJ_VERSION in src/jj.rs).
  JJ_VERSION: "0.45.1"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install jj
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.local/bin" ./jj
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check jj
        run: jj --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Integration tests drive the real jj, git and ssh-keygen; they fail,
      # never skip, when one is missing.
      - name: Test
        run: cargo test --locked

  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  test-windows:
    name: Test (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # jj from the official zip; ssh-keygen from Git for Windows, which the
      # signed-push tests use. Same setup the suite was validated with.
      - name: Install jj
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\jj.zip"
          $dir = "$env:RUNNER_TEMP\jj"
          Invoke-WebRequest "https://github.com/jj-vcs/jj/releases/download/v$env:JJ_VERSION/jj-v$env:JJ_VERSION-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files\Git\usr\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Check jj
        run: jj --version

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Suites built on shell-script fixtures are cfg(unix); the rest, plus
      # tests/setup_windows.rs, run here.
      - name: Test
        run: cargo test --locked

  build-macos:
    name: Build (macOS)
    # The suite uses Linux-only fixtures (/proc) in places, so macOS builds
    # and lints the library and binary only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Build
        run: cargo build --locked --release
